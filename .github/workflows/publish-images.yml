name: Publish images

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/logicexception/timey-api:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/LogicException/timey
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/logicexception/timey-web:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/LogicException/timey
