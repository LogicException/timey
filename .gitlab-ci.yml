stages:
  - test

api:
  stage: test
  image: rust:1.87-bookworm
  cache:
    key: cargo
    paths:
      - api/target/
  script:
    - rustup component add clippy
    - cd api
    - cargo clippy --all-targets -- -D warnings
    - cargo test

web:
  stage: test
  image: node:22-bookworm
  cache:
    key: npm
    paths:
      - web/node_modules/
  script:
    - cd web
    - npm ci
    - npm test
    - npm run check
    - npm run build
